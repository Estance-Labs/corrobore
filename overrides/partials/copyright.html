{% if config.copyright %}
  <div class="md-footer-copyright">
    <div class="md-footer-copyright__neotance">
      <img
        src="{{ 'assets/neotance-mark.svg' | url }}"
        alt="Noetance logo"
        class="md-footer-copyright__logo"
        width="24"
        height="24"
        loading="lazy"
      />
      <span class="md-footer-copyright__highlight">{{ config.copyright }}</span>
    </div>
    {% if config.extra.generator | default(true) %}
      Made with
      <a href="https://squidfunk.github.io/mkdocs-material/" target="_blank" rel="noopener">
        Material for MkDocs
      </a>
    {% endif %}
  </div>
{% endif %}
