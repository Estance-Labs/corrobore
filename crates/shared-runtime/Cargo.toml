[package]
name = "shared-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[lib]
name = "shared_runtime"
path = "src/lib.rs"

[dependencies]
cypher-executor = { path = "../cypher-executor" }
# The parser owns the string-literal grammar. Parameter binding depends on it
# directly so quoting and escaping cannot drift from what the parser decodes.
cypher-parser = { path = "../cypher-parser" }
graph-core = { path = "../graph-core" }
serde = { workspace = true }
# A tamper-evident mutation chain needs a cryptographic digest. The workspace
# release is shared, so the crypto dependency contract still resolves one sha2.
sha2 = { workspace = true }
thiserror = { workspace = true }

[[example]]
name = "capability_catalogue"
path = "examples/capability_catalogue.rs"

[dev-dependencies]
# The audit-chain contract serializes a chain to simulate tampering.
serde_json = { workspace = true }

[lints]
workspace = true
