[package]
name = "corrobore-http-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[lib]
name = "corrobore_http_server"
path = "src/lib.rs"

[[bin]]
name = "corrobore-http-server"
path = "src/main.rs"

[[bin]]
name = "corrobore"
path = "src/bin/corrobore.rs"

[dependencies]
axum = { workspace = true }
axum-server = { workspace = true }
base64 = "0.23"
chrono = { workspace = true }
clap = { workspace = true }
corrobore-engine = { path = "../corrobore-engine" }
corrobore-cold-tier = { path = "../corrobore-cold-tier", optional = true }
cypher-parser = { path = "../cypher-parser" }
cypher-planner = { path = "../cypher-planner" }
storage-interchange = { path = "../storage-interchange" }
dotenvy = { workspace = true }
domain-provider-abi = { path = "../domain-provider-abi" }
corrobore-nlq = { path = "../corrobore-nlq" }
graph-core = { path = "../graph-core" }
graph-storage = { path = "../graph-storage" }
cedar-policy = { version = "4.14.1", default-features = false }
hmac = { workspace = true }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["aws_lc_rs"] }
libloading = "0.8"
opencti-adapter = { path = "../opencti-adapter" }
opencti-file-search = { path = "../opencti-file-search" }
percent-encoding = "2"
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = "0.7"
reqwest = { workspace = true }
rustls = { workspace = true }
sha2 = { workspace = true }
shared-runtime = { path = "../shared-runtime" }
sql-frontend = { path = "../sql-frontend" }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "sync"] }
tokio-rustls = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["fs"] }
url = { workspace = true }
tower_governor = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
toml = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true }
yaml_serde = "0.10.7"

[features]
# Lance cold tier for pruned graph history (issue #392, ADR-0023).
lance-cold-tier = ["dep:corrobore-cold-tier"]

[dev-dependencies]
http-body-util = { workspace = true }
rcgen = "0.14.8"
tower = { workspace = true }

[lints]
workspace = true
