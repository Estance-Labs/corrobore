site_name: Corrobore
site_description: A Rust-native, Cypher-compatible structured working memory for intelligence agents.
site_url: https://docs.corrobore.org/
repo_url: https://github.com/Estance-Labs/corrobore
edit_uri: edit/main/docs/

copyright: "Copyright &copy; 2026 AreDee-Bangs &mdash; Licensed under MIT"

theme:
  name: material
  custom_dir: overrides
  logo: assets/corrobore-mark.svg
  favicon: assets/corrobore-mark.svg
  font: false
  palette:
    - scheme: corrobore-dark
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: corrobore-light
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/corrobore.css

markdown_extensions:
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

