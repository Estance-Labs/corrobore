name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    uses: ./.github/workflows/unit-tests.yml

  build-release-assets:
    name: Build and test (${{ matrix.artifact_suffix }})
    runs-on: ${{ matrix.os }}
    needs: unit-tests
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_suffix: linux-x64
            archive_ext: tar.gz
          - os: ubuntu-24.04-arm
            artifact_suffix: linux-arm64
            archive_ext: tar.gz
          - os: macos-15-intel
            artifact_suffix: macos-x64
            archive_ext: tar.gz
          - os: macos-latest
            artifact_suffix: macos-arm64
            archive_ext: tar.gz
          - os: windows-latest
            artifact_suffix: windows-x64
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache Cargo registry and build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build public release binaries
        run: cargo build --release --locked -p corrobore-http-server -p corrobore-ingest --bins

      - name: Archive release binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release-artifacts
          cp target/release/corrobore-http-server target/release/corrobore-ingest release-artifacts/
          (cd release-artifacts && shasum -a 256 corrobore-http-server corrobore-ingest > SHA256SUMS)
          tar -czf release-artifacts-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.tar.gz -C release-artifacts .

      - name: Archive release binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          Copy-Item target/release/corrobore-http-server.exe,target/release/corrobore-ingest.exe -Destination release-artifacts
          Get-FileHash release-artifacts/*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content release-artifacts/SHA256SUMS
          Compress-Archive -Path release-artifacts/* -DestinationPath release-artifacts-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.zip -Force

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact_suffix }}
          path: release-artifacts-${{ github.ref_name }}-${{ matrix.artifact_suffix }}.${{ matrix.archive_ext }}

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-release-assets
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release-artifacts-${{ github.ref_name }}-linux-x64.tar.gz
            release-artifacts-${{ github.ref_name }}-linux-arm64.tar.gz
            release-artifacts-${{ github.ref_name }}-macos-x64.tar.gz
            release-artifacts-${{ github.ref_name }}-macos-arm64.tar.gz
            release-artifacts-${{ github.ref_name }}-windows-x64.zip
