name: Agent Plugin

on:
  pull_request:
    branches:
      - main
    paths:
      - 'plugins/corrobore/**'
      - 'scripts/agent-plugin-contract.test.mjs'
      - 'scripts/agent-plugin-mcp.test.mjs'
      - '.github/workflows/agent-plugin-release.yml'
  push:
    branches:
      - main
    tags:
      - 'agent-plugin-v*'
    paths:
      - 'plugins/corrobore/**'
      - 'scripts/agent-plugin-contract.test.mjs'
      - 'scripts/agent-plugin-mcp.test.mjs'
      - '.github/workflows/agent-plugin-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate portable package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.4.0

      - name: Validate Agent Plugins and Agent Skills contracts
        run: |
          node --test scripts/agent-plugin-contract.test.mjs
          node --test scripts/agent-plugin-mcp.test.mjs

  release:
    name: Publish versioned archive
    if: startsWith(github.ref, 'refs/tags/agent-plugin-v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Match tag to plugin version
        run: |
          plugin_version="$(jq -r '.version' plugins/corrobore/plugin.json)"
          test "$GITHUB_REF_NAME" = "agent-plugin-v${plugin_version}"

      - name: Build portable archive
        run: |
          git archive \
            --format=zip \
            --prefix=corrobore/ \
            --output=corrobore-agent-plugin.zip \
            "$GITHUB_SHA:plugins/corrobore"
          unzip -t corrobore-agent-plugin.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            corrobore-agent-plugin.zip \
            --title "Corrobore Agent Plugin ${GITHUB_REF_NAME#agent-plugin-v}" \
            --generate-notes
