name: EE Provider Retrieval Contract

on:
  pull_request:
    paths:
      - 'scripts/fetch-ee-domain-binaries.mjs'
      - 'scripts/fetch-ee-domain-binaries.test.mjs'
      - 'docs/user-guide/domain-provider-operations.md'
      - '.github/workflows/ee-provider-retrieval.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-ee-domain-binaries.mjs'
      - 'scripts/fetch-ee-domain-binaries.test.mjs'
      - 'docs/user-guide/domain-provider-operations.md'
      - '.github/workflows/ee-provider-retrieval.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ee-provider-retrieval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate retrieval and integrity checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run provider retrieval contract tests
        run: node --test scripts/fetch-ee-domain-binaries.test.mjs
