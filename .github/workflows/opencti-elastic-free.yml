name: Elastic-free OpenCTI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/opencti-elastic-free.yml"
      - ".github/workflows/release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "packaging/opencti-elastic-free/**"
      - "scripts/opencti-elastic-free-*"
      - "docs/acceptance/opencti-elastic-free.md"
      - "docs/user-guide/opencti-elastic-free-operations.md"
  workflow_dispatch:
    inputs:
      full_stack:
        description: Build and run the exact pinned OpenCTI stack
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: opencti-elastic-free-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Distribution contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate distribution and migration contracts
        run: |
          node --test scripts/opencti-elastic-free-contract.test.mjs
          bash -n scripts/opencti-elastic-free-migrate.sh scripts/opencti-elastic-free-acceptance.sh

      - name: Use Node.js 22 for the pinned OpenCTI provider
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify the provider from the pinned Estance OpenCTI fork
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Estance-Labs/opencti.git /tmp/opencti
          git -C /tmp/opencti fetch --depth 1 origin e5d780f11378d584d97261603d10157b62b36978
          git -C /tmp/opencti checkout --detach e5d780f11378d584d97261603d10157b62b36978
          cd /tmp/opencti/opencti-platform/opencti-graphql
          corepack enable
          yarn install --immutable
          yarn vitest run tests/01-unit/database/corrobore-provider-test.ts
          yarn get-connectors-manifest
          yarn check-ts

  local-matrix:
    name: Corrobore OpenCTI matrix
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-opencti-elastic-free-${{ hashFiles('**/Cargo.lock') }}

      - name: Run mapped local acceptance
        env:
          OPENCTI_ACCEPTANCE_ARTIFACT_DIR: acceptance-artifacts/opencti-local
        run: scripts/opencti-elastic-free-acceptance.sh local

      - name: Preserve diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: opencti-elastic-free-local-diagnostics
          path: acceptance-artifacts/
          if-no-files-found: warn
          retention-days: 14

  exact-stack:
    name: Exact image and stack gate
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.full_stack)
    needs: local-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create ephemeral acceptance secrets
        run: |
          mkdir -p packaging/opencti-elastic-free/secrets packaging/opencti-elastic-free/state
          printf '%s\n' acceptance-admin-password > packaging/opencti-elastic-free/secrets/opencti-admin-password
          printf '%s\n' 00000000-0000-4000-8000-000000000054 > packaging/opencti-elastic-free/secrets/opencti-admin-token
          printf '%s\n' acceptance-health > packaging/opencti-elastic-free/secrets/opencti-health-key
          openssl rand -base64 -out packaging/opencti-elastic-free/secrets/opencti-encryption-key 32
          printf '%s\n' acceptance-corrobore > packaging/opencti-elastic-free/secrets/corrobore-http-token
          printf '%s\n' acceptance-rabbitmq > packaging/opencti-elastic-free/secrets/rabbitmq-password
          printf '%s\n' acceptance-minio-secret > packaging/opencti-elastic-free/secrets/minio-secret-key
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout packaging/opencti-elastic-free/secrets/tls.key \
            -out packaging/opencti-elastic-free/secrets/tls.crt -days 1 \
            -subj /CN=corrobore -addext subjectAltName=DNS:corrobore
          chmod 0700 packaging/opencti-elastic-free/secrets
          chmod 0444 packaging/opencti-elastic-free/secrets/*
          cp packaging/opencti-elastic-free/.env.example packaging/opencti-elastic-free/.env

      - name: Build and run exact shipped artifacts
        env:
          OPENCTI_ACCEPTANCE_ARTIFACT_DIR: acceptance-artifacts/opencti-stack
          OPENCTI_ACCEPTANCE_TIMEOUT_SECONDS: "600"
          OPENCTI_CORROBORE_COMPOSE_FILE: packaging/opencti-elastic-free/compose.yml
          OPENCTI_CORROBORE_ENV_FILE: packaging/opencti-elastic-free/.env
        run: scripts/opencti-elastic-free-acceptance.sh stack

      - name: Upload exact stack evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opencti-elastic-free-stack-evidence
          path: acceptance-artifacts/
          if-no-files-found: warn
          retention-days: 30
