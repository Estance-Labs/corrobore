# cargo-deny configuration (audit §3.2).
# Run locally with: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
# Security vulnerabilities always fail the check. Yanked crates are surfaced as
# a warning: the only current hit is `spin 0.9.8` pulled transitively through
# axum 0.7 -> multer, which is removed by the axum 0.8 upgrade batch (#240).
yanked = "warn"
ignore = []

[licenses]
version = 2
# Permissive licenses acceptable for an MIT-licensed workspace.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions are a hygiene smell, not a hard failure yet.
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
