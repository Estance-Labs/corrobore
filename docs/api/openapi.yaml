openapi: 3.1.0
info:
  title: Corrobore HTTP API
  version: 0.3.3
  description: |
    Agent-facing Corrobore API. `/health/live`, `/health/ready`, `/version`,
    legacy `/health`, and `/metrics` are public; every `/v1/*` operation
    requires a Bearer token. Every response carries the request correlation
    identifier in `X-Request-Id`; a valid client-provided value is preserved.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://127.0.0.1:8080
    description: Default local server

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    SessionPath:
      name: session_id
      in: path
      required: true
      schema: {type: string}
  headers:
    RequestId:
      description: Request correlation identifier, preserved when the client supplies a valid X-Request-Id.
      schema: {type: string, maxLength: 128}
  responses:
    BadRequest:
      description: Invalid query selection or projection budget
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid Bearer token
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ReadinessResponse:
      type: object
      required: [status, ready, service, lifecycle_state, checks]
      properties:
        status: {type: string, enum: [ready, not_ready]}
        ready: {type: boolean}
        service: {type: string, const: corrobore-http-server}
        lifecycle_state:
          type: string
          enum: [initializing, ready, draining, stopped, failed]
        checks:
          type: object
          required: [engine_initialized, storage_recovered, accepting_requests]
          properties:
            engine_initialized: {type: boolean}
            storage_recovered: {type: boolean}
            accepting_requests: {type: boolean}
    ErrorEnvelope:
      type: object
      required: [ok, correlation_id, error]
      properties:
        ok: {type: boolean, const: false}
        correlation_id: {type: string, maxLength: 128}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
    CypherRequest:
      type: object
      required: [query]
      properties:
        query: {type: string}
        params:
          type: object
          description: >-
            Values bound to `$name` placeholders, keyed without the `$` prefix.
            Scalar JSON types are preserved, so an integer bound to `LIMIT $n`
            stays an integer. Arrays and objects are rejected.
          additionalProperties:
            oneOf:
              - {type: string}
              - {type: number}
              - {type: boolean}
              - {type: 'null'}
        mode:
          type: string
          enum: [read, write, validate, auto]
        workspace_id: {type: string}
        session_id: {type: string}
        budget_ref: {type: string}
    CypherEnvelope:
      type: object
      required: [ok, result]
      properties:
        ok: {type: boolean, const: true}
        result:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [Success, Rejected, ValidationFailed]
            data: {}
            mutation_summary: {}
            validation_errors:
              type: array
              items:
                type: object
                properties:
                  code: {type: string}
                  message: {type: string}
    StixBundle:
      type: object
      required: [type, objects]
      properties:
        type: {type: string, const: bundle}
        id: {type: string}
        spec_version: {type: string, const: '2.1'}
        objects:
          type: array
          items: {type: object}
        export_metadata:
          type: object
          required: [snapshot_id, transaction_id, exporter_version, profile, mode, determinism_key]
          properties:
            snapshot_id: {type: string}
            transaction_id: {type: string}
            exporter_version: {type: string}
            profile: {type: string, enum: [stix-mvp]}
            mode: {type: string, enum: [strict, permissive]}
            determinism_key: {type: string}
        export_diagnostics:
          type: object
          required: [exclusions]
          properties:
            exclusions:
              type: array
              maxItems: 256
              items:
                type: object
                required: [code, message, target_kind, record_id]
                properties:
                  code: {type: string}
                  message: {type: string}
                  target_kind: {type: string, enum: [node, relationship]}
                  record_id: {type: string}
        x_corrobore_evidence:
          type: array
          description: Retained native evidence records referenced by exported objects.
          items: {type: object}
    StixImportRequest:
      type: object
      required: [bundle]
      properties:
        bundle: {$ref: '#/components/schemas/StixBundle'}
        evidence:
          $ref: '#/components/schemas/StixEvidenceEnvelopeV1'
        workspace_id:
          type: string
          description: Trusted runtime workspace context; never read from the STIX bundle.
        session_id:
          type: string
          description: Trusted runtime session context; never read from the STIX bundle.
        budget_ref:
          type: string
          description: Trusted runtime budget context; never read from the STIX bundle.
    StixEvidenceEnvelopeV1:
      type: object
      required: [schema_version, records, annotations]
      properties:
        schema_version:
          type: string
          const: '1.0'
        records:
          type: array
          items: {$ref: '#/components/schemas/StixEvidenceRecordV1'}
        annotations:
          type: object
          description: Native candidate metadata keyed by an exact STIX ID present in bundle.objects.
          additionalProperties:
            $ref: '#/components/schemas/StixRecordAnnotationV1'
    StixEvidenceRecordV1:
      type: object
      required: [id, source_id, content_sha256, payload, locator]
      properties:
        id:
          type: string
          description: Stable caller-owned evidence identifier.
        source_id:
          type: string
          description: Stable document or source identity.
        content_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lowercase SHA-256 digest of the complete source content.
        payload:
          type: string
          minLength: 1
          description: Exact bounded excerpt supporting the annotated record.
        locator: {$ref: '#/components/schemas/StixEvidenceLocatorV1'}
        source_url: {type: string, format: uri}
        extractor_id: {type: string}
        model_version: {type: string}
        language: {type: string}
    StixEvidenceLocatorV1:
      oneOf:
        - type: object
          required: [type, page]
          properties:
            type: {type: string, const: page}
            page: {type: integer, minimum: 1, maximum: 1000000}
        - type: object
          required: [type, paragraph]
          properties:
            type: {type: string, const: paragraph}
            page: {type: integer, minimum: 1, maximum: 1000000}
            paragraph: {type: integer, minimum: 1, maximum: 1000000}
        - type: object
          required: [type, table, row, column]
          properties:
            type: {type: string, const: table_cell}
            page: {type: integer, minimum: 1, maximum: 1000000}
            table: {type: integer, minimum: 1, maximum: 1000000}
            row: {type: integer, minimum: 1, maximum: 1000000}
            column: {type: integer, minimum: 1, maximum: 1000000}
        - type: object
          required: [type, start, end]
          properties:
            type: {type: string, const: byte_range}
            start: {type: integer, minimum: 0}
            end: {type: integer, minimum: 1}
          description: Half-open byte range; end must be greater than start.
      discriminator:
        propertyName: type
    StixRecordAnnotationV1:
      type: object
      properties:
        evidence_refs:
          type: array
          uniqueItems: true
          items: {type: string}
        confidence:
          type: number
          minimum: 0
          maximum: 100
          description: STIX import confidence uses 0..=100 and is normalized deterministically to native 0..=1. Example: 90 is stored as native 0.9.
          examples: [90]
        status:
          type: string
          const: candidate
          description: Import cannot assert validated, exportable or exported authority.
    ImportResult:
      type: object
      required: [processed_objects, applied_mutations, rejected_mutations, errors, outcomes, metrics]
      properties:
        processed_objects: {type: integer, minimum: 0}
        applied_mutations: {type: integer, minimum: 0}
        rejected_mutations: {type: integer, minimum: 0}
        errors:
          type: array
          items: {type: string}
        outcomes:
          type: array
          description: Canonically ordered, bounded per-record outcomes independent of bundle order.
          items: {$ref: '#/components/schemas/StixImportObjectOutcome'}
        metrics: {$ref: '#/components/schemas/StixImportMutationMetrics'}
    StixImportOutcomeStatus:
      type: string
      enum: [created, updated, duplicate, rejected, unresolved_reference, failed]
    StixImportObjectOutcome:
      type: object
      required: [id, record_type, status]
      properties:
        id: {type: string}
        record_type: {type: string}
        status: {$ref: '#/components/schemas/StixImportOutcomeStatus'}
        reference:
          type: string
          description: Missing canonical reference for unresolved_reference.
        error_code: {type: string}
    StixImportMutationMetrics:
      type: object
      required: [requested, created, updated, duplicate, rejected, unresolved_reference, failed]
      properties:
        requested: {type: integer, minimum: 0}
        created: {type: integer, minimum: 0}
        updated: {type: integer, minimum: 0}
        duplicate: {type: integer, minimum: 0}
        rejected: {type: integer, minimum: 0}
        unresolved_reference: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
    SessionStatus:
      type: string
      enum: [idle, working, processing, degraded, stopped]
    ExplorerSession:
      type: object
      required: [session_id, workspace_id, actor_id, actor_kind, status, started_at_ms, updated_at_ms]
      properties:
        session_id: {type: string}
        workspace_id: {type: string}
        actor_id: {type: string}
        actor_kind:
          type: string
          enum: [user, agent, orchestrator_agent, worker_agent, tool, system, test_fixture]
        status: {$ref: '#/components/schemas/SessionStatus'}
        started_at_ms: {type: integer, minimum: 0}
        updated_at_ms: {type: integer, minimum: 0}
        auto_stopped_due_to_idle_ttl: {type: boolean}
    DomainProviderCapability:
      type: object
      required: [name, version]
      properties:
        name: {type: string}
        version: {type: string}
    DomainProviderIssue:
      type: object
      required: [code, message, severity]
      properties:
        code: {type: string}
        message: {type: string}
        field: {type: [string, 'null']}
        severity: {type: string, enum: [error, warning]}
        node_id: {type: [string, 'null']}
    OpenCtiSyncPhase:
      type: string
      enum: [snapshot, catch_up, steady_state]
    OpenCtiMutationClass:
      type: string
      enum: [upsert, delete, relationship_upsert, relationship_delete, access_policy_update]
    OpenCtiMutation:
      type: object
      required: [operation_id, sequence, class, record]
      properties:
        operation_id: {type: string, minLength: 1}
        sequence: {type: integer, minimum: 1}
        class: {$ref: '#/components/schemas/OpenCtiMutationClass'}
        record: {type: object, additionalProperties: true}
    OpenCtiSyncBatch:
      type: object
      required: [source_id, snapshot_id, phase, high_water_mark, snapshot_complete, operations]
      properties:
        source_id: {type: string, minLength: 1}
        snapshot_id: {type: string, minLength: 1}
        phase: {$ref: '#/components/schemas/OpenCtiSyncPhase'}
        high_water_mark: {type: integer, minimum: 0}
        snapshot_complete: {type: boolean}
        operations:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/OpenCtiMutation'}
    OpenCtiGraphDigest:
      type: object
      required:
        - object_count
        - relationship_count
        - canonical_checksum
        - property_checksum
        - identifier_checksum
        - relation_checksum
        - access_policy_checksum
      properties:
        object_count: {type: integer, minimum: 0}
        relationship_count: {type: integer, minimum: 0}
        canonical_checksum: {type: string}
        property_checksum: {type: string}
        identifier_checksum: {type: string}
        relation_checksum: {type: string}
        access_policy_checksum: {type: string}
    OpenCtiSyncStatus:
      type: object
      required:
        - initialized
        - last_acknowledged_sequence
        - high_water_mark
        - lag
        - queue_depth
        - retry_count
        - rejected_operations
        - quarantined_operations
        - divergence_dimensions
        - shadow_reads_enabled
      properties:
        initialized: {type: boolean}
        phase:
          oneOf:
            - {$ref: '#/components/schemas/OpenCtiSyncPhase'}
            - {type: 'null'}
        last_acknowledged_sequence: {type: integer, minimum: 0}
        high_water_mark: {type: integer, minimum: 0}
        lag: {type: integer, minimum: 0}
        queue_depth: {type: integer, minimum: 0}
        retry_count: {type: integer, minimum: 0}
        rejected_operations: {type: integer, minimum: 0}
        quarantined_operations: {type: integer, minimum: 0}
        divergence:
          type: [string, 'null']
          enum: [unknown, diverged, in_sync, null]
        divergence_dimensions:
          type: array
          items: {type: string}
        shadow_reads_enabled: {type: boolean}
    OpenCtiWriteContext:
      type: object
      required: [request_id, correlation_id, idempotency_key, access, consistency]
      properties:
        request_id: {type: string, minLength: 1}
        correlation_id: {type: string, minLength: 1}
        idempotency_key:
          type: string
          minLength: 1
          description: Replay-safe caller key; only its SHA-256 digest is retained in audit state.
        deadline_unix_ms: {type: [integer, 'null'], minimum: 0}
        cancellation_id: {type: [string, 'null']}
        access:
          type: object
          required: [subject_id]
          properties:
            subject_id: {type: string, minLength: 1}
            organization_ids: {type: array, items: {type: string}}
            marking_ids: {type: array, items: {type: string}}
            tenant_id: {type: [string, 'null']}
            roles: {type: array, items: {type: string}}
            attributes:
              type: object
              additionalProperties: {type: string}
        consistency: {type: string, enum: [eventual, read_your_writes, snapshot]}
    OpenCtiWriteOperation:
      oneOf:
        - type: object
          required: [operation, request]
          properties:
            operation: {type: string, const: create}
            request:
              type: object
              required: [record]
              properties:
                record: {type: object, additionalProperties: true}
        - type: object
          required: [operation, request]
          properties:
            operation: {type: string, const: update}
            request:
              type: object
              required: [id, patch]
              properties:
                id: {type: string, minLength: 1}
                expected_revision: {type: [integer, 'null'], minimum: 1}
                patch: {type: object, additionalProperties: true}
        - type: object
          required: [operation, request]
          properties:
            operation: {type: string, const: delete}
            request:
              type: object
              required: [id]
              properties:
                id: {type: string, minLength: 1}
                expected_revision: {type: [integer, 'null'], minimum: 1}
        - type: object
          required: [operation, request]
          properties:
            operation: {type: string, const: bulk}
            request:
              type: object
              required: [operations, atomic]
              properties:
                operations:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    description: Ordered create, update, access_policy_update, or delete item.
                atomic: {type: boolean}
        - type: object
          required: [operation, request]
          properties:
            operation: {type: string, const: merge}
            request:
              type: object
              required: [target_id, source_ids]
              properties:
                target_id: {type: string, minLength: 1}
                source_ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: {type: string, minLength: 1}
                expected_revisions:
                  type: object
                  additionalProperties: {type: integer, minimum: 1}
    OpenCtiWriteRequest:
      type: object
      required: [contract_version, context, operation]
      properties:
        contract_version:
          type: object
          required: [major, minor]
          properties:
            major: {type: integer, const: 1}
            minor: {type: integer, minimum: 0}
        context: {$ref: '#/components/schemas/OpenCtiWriteContext'}
        operation: {$ref: '#/components/schemas/OpenCtiWriteOperation'}
    OpenCtiWriteStatus:
      type: object
      required:
        - pending_reconciliation
        - fully_reconciled
        - applied_operations
        - failed_operations
        - idempotent_replays
        - quarantined_reconciliation
        - projection_outbox_depth
        - projection_lag
        - projection_retries
        - projection_quarantined
        - write_authority
        - fully_synchronized
        - reconstruction_runs
      properties:
        pending_reconciliation: {type: integer, minimum: 0}
        fully_reconciled: {type: boolean}
        applied_operations: {type: integer, minimum: 0}
        failed_operations: {type: integer, minimum: 0}
        idempotent_replays: {type: integer, minimum: 0}
        quarantined_reconciliation: {type: integer, minimum: 0}
        projection_outbox_depth: {type: integer, minimum: 0}
        projection_lag: {type: integer, minimum: 0}
        projection_retries: {type: integer, minimum: 0}
        projection_quarantined: {type: integer, minimum: 0}
        write_authority:
          type: string
          enum: [corrobore_primary, writes_suspended, reference_primary]
        fully_synchronized: {type: boolean}
        reconstruction_runs: {type: integer, minimum: 0}
    OpenCtiReconciliationCommand:
      type: object
      required: [command_id, mode, scope, reference_records, allow_extra_deletion]
      properties:
        command_id: {type: string, minLength: 1}
        mode: {type: string, enum: [dry_run, repair]}
        scope:
          oneOf:
            - type: object
              required: [scope, record_ids]
              properties:
                scope: {type: string, const: records}
                record_ids:
                  type: array
                  uniqueItems: true
                  items: {type: string, minLength: 1}
            - type: object
              required: [scope, start_inclusive, end_exclusive, max_records]
              properties:
                scope: {type: string, const: range}
                start_inclusive: {type: string, minLength: 1}
                end_exclusive: {type: string, minLength: 1}
                max_records: {type: integer, minimum: 1}
            - type: object
              required: [scope, partition, partition_count, max_records]
              properties:
                scope: {type: string, const: partition}
                partition: {type: integer, minimum: 0}
                partition_count: {type: integer, minimum: 1}
                max_records: {type: integer, minimum: 1}
            - type: object
              required: [scope, max_records]
              properties:
                scope: {type: string, const: full}
                max_records: {type: integer, minimum: 1}
        reference_records:
          type: array
          items: {type: object, additionalProperties: true}
        allow_extra_deletion: {type: boolean}
    OpenCtiReconciliationDifference:
      type: object
      required: [record_id, kind, action, diagnostic]
      properties:
        record_id: {type: string}
        kind:
          type: string
          enum: [missing, extra, property_divergent, relationship_divergent, permission_divergent, stale_index]
        action:
          type: string
          enum: [planned_create, planned_replace, planned_delete, planned_projection_rebuild, applied, quarantined]
        diagnostic: {type: string}
    OpenCtiReconciliationReport:
      type: object
      required: [command_id, mode, mutated, parity_verified, differences, quarantined_record_ids, projection_rebuild_ids]
      properties:
        command_id: {type: string}
        mode: {type: string, enum: [dry_run, repair]}
        mutated: {type: boolean}
        parity_verified: {type: boolean}
        differences:
          type: array
          items: {$ref: '#/components/schemas/OpenCtiReconciliationDifference'}
        quarantined_record_ids: {type: array, items: {type: string}}
        projection_rebuild_ids: {type: array, items: {type: string}}
    OpenCtiReconciliationStatus:
      type: object
      required: [retained_reports, quarantined_commands, parity_verified_commands]
      properties:
        retained_reports: {type: integer, minimum: 0}
        quarantined_commands: {type: integer, minimum: 0}
        parity_verified_commands: {type: integer, minimum: 0}

    CreateSnapshotCommand:
      type: object
      required: [destination]
      properties:
        destination: {type: string, description: New server-local artifact directory}
        encryption_key_id: {type: string, description: External KMS or provider key identity; never key material}
        retention_hook: {type: string, description: Provider lifecycle policy reference}
    SnapshotReport:
      type: object
      required: [manifest_version, readiness, graph_id, canonical_generation, wal_boundary, file_count, total_bytes, snapshot_root]
      properties:
        manifest_version: {type: integer, const: 1}
        readiness: {type: string, enum: [ready, rebuilding, offline_required, failed, cancelled]}
        graph_id: {type: string}
        canonical_generation: {type: integer, minimum: 1}
        wal_boundary: {type: integer, minimum: 1}
        file_count: {type: integer, minimum: 1}
        total_bytes: {type: integer, minimum: 1}
        snapshot_root: {type: string}
    DatabaseOperationMetrics:
      type: object
      properties:
        snapshots_completed: {type: integer, minimum: 0}
        snapshot_failures: {type: integer, minimum: 0}
        snapshot_bytes: {type: integer, minimum: 0}
        snapshot_duration_ms: {type: integer, minimum: 0}
        rebuilds_completed: {type: integer, minimum: 0}
        rebuild_failures: {type: integer, minimum: 0}
        rebuild_duration_ms: {type: integer, minimum: 0}
        rebuild_records_scanned: {type: integer, minimum: 0}

    MemoryContractVersion:
      type: string
      const: v1
    MemoryProvenanceReference:
      type: object
      additionalProperties: false
      required: [source_id]
      properties:
        source_id: {type: string, minLength: 1}
        locator: {type: [string, 'null']}
        observed_at: {type: [string, 'null'], format: date-time}
    MemoryContent:
      oneOf:
        - type: object
          additionalProperties: false
          required: [format, value]
          properties:
            format: {type: string, const: text}
            value: {type: string, minLength: 1}
        - type: object
          additionalProperties: false
          required: [format, value]
          properties:
            format: {type: string, const: properties}
            value: {type: object}
        - type: object
          additionalProperties: false
          required: [format, value]
          properties:
            format: {type: string, const: text_and_properties}
            value:
              type: object
              additionalProperties: false
              required: [text, properties]
              properties:
                text: {type: string, minLength: 1}
                properties: {type: object}
    MemoryLimits:
      type: object
      additionalProperties: false
      required: [max_items, max_depth, max_payload_bytes, max_cost, timeout_ms, supernode_threshold]
      properties:
        max_items: {type: integer, minimum: 1, maximum: 10000}
        max_depth: {type: integer, minimum: 1, maximum: 16}
        max_payload_bytes: {type: integer, minimum: 1, maximum: 16777216}
        max_cost: {type: integer, minimum: 1, maximum: 1000000}
        timeout_ms: {type: integer, minimum: 1, maximum: 60000}
        supernode_threshold: {type: integer, minimum: 1}
    RecallOutcome:
      type: string
      enum: [supernode_blocked, cost_budget_exhausted, payload_budget_exhausted, timeout, semantic_provider_unavailable, partial_page_in, cancelled, overloaded]
      description: Stable bounded outcome emitted instead of unbounded expansion or fallback.
    MemoryTarget:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: {type: string, enum: [memory, relationship, recall, mutation]}
        id: {type: string, minLength: 1}
    MemoryOperationRequest:
      type: object
      additionalProperties: false
      required: [contract_version, operation, input]
      properties:
        contract_version: {$ref: '#/components/schemas/MemoryContractVersion'}
        idempotency_key:
          type: [string, 'null']
          minLength: 1
          maxLength: 256
          description: Required for remember, relate, update, forget, and approved consolidation apply.
        operation:
          type: string
          enum: [remember, relate, recall, update, forget, consolidate, trace]
        input:
          oneOf:
            - $ref: '#/components/schemas/RememberMemoryInput'
            - $ref: '#/components/schemas/RelateMemoryInput'
            - $ref: '#/components/schemas/RecallMemoryInput'
            - $ref: '#/components/schemas/UpdateMemoryInput'
            - $ref: '#/components/schemas/ForgetMemoryInput'
            - $ref: '#/components/schemas/ConsolidateMemoryInput'
            - $ref: '#/components/schemas/TraceMemoryInput'
      description: Trusted workspace, actor, agent, session, permissions, request, and correlation fields are not accepted in this payload.
    RememberMemoryInput:
      type: object
      additionalProperties: false
      required: [kind, schema_version, content, provenance, tags]
      properties:
        identity_key: {type: [string, 'null']}
        kind: {type: string, minLength: 1}
        schema_version: {type: string, minLength: 1}
        content: {$ref: '#/components/schemas/MemoryContent'}
        provenance: {type: array, items: {$ref: '#/components/schemas/MemoryProvenanceReference'}}
        confidence: {type: [number, 'null'], minimum: 0, maximum: 1}
        valid_from: {type: [string, 'null'], format: date-time}
        valid_until: {type: [string, 'null'], format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        tags: {type: array, items: {type: string}}
    RelateMemoryInput:
      type: object
      additionalProperties: false
      required: [source_id, target_id, kind, properties, provenance, lifecycle]
      properties:
        identity_key: {type: [string, 'null']}
        source_id: {type: string, minLength: 1}
        target_id: {type: string, minLength: 1}
        kind: {type: string, minLength: 1}
        properties: {}
        provenance: {type: array, items: {$ref: '#/components/schemas/MemoryProvenanceReference'}}
        confidence: {type: [number, 'null'], minimum: 0, maximum: 1}
        valid_from: {type: [string, 'null'], format: date-time}
        valid_until: {type: [string, 'null'], format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        lifecycle: {type: string, enum: [active, expired, superseded, tombstoned]}
    RecallMemoryInput:
      type: object
      additionalProperties: false
      required: [objective, seed_ids, limits]
      properties:
        objective: {type: string, minLength: 1}
        seed_ids: {type: array, items: {type: string}}
        limits: {$ref: '#/components/schemas/MemoryLimits'}
        page_token: {type: [string, 'null']}
    UpdateMemoryInput:
      type: object
      additionalProperties: false
      required: [target, patch]
      properties:
        target: {$ref: '#/components/schemas/MemoryTarget'}
        expected_version: {type: [integer, 'null'], minimum: 1}
        patch:
          type: object
          additionalProperties: false
          properties:
            content: {$ref: '#/components/schemas/MemoryContent'}
            confidence: {type: number, minimum: 0, maximum: 1}
            add_provenance: {type: array, items: {$ref: '#/components/schemas/MemoryProvenanceReference'}}
            lifecycle: {type: string, enum: [active, expired, superseded, tombstoned]}
            expires_at: {type: string, format: date-time}
            add_tags: {type: array, items: {type: string}}
    ForgetMemoryInput:
      type: object
      additionalProperties: false
      required: [memory_id, mode, reason]
      properties:
        memory_id: {type: string, minLength: 1}
        mode: {type: string, enum: [expire, tombstone, application_delete]}
        expires_at: {type: [string, 'null'], format: date-time}
        reason: {type: string, minLength: 1}
    ConsolidateMemoryInput:
      type: object
      additionalProperties: false
      required: [mode, memory_ids, reason, preserve_disagreements]
      properties:
        mode:
          oneOf:
            - type: object
              required: [mode]
              properties: {mode: {type: string, const: propose}}
            - type: object
              required: [mode, proposal_id, approval_policy]
              properties:
                mode: {type: string, const: apply_approved}
                proposal_id: {type: string}
                approval_policy: {type: string}
        memory_ids: {type: array, minItems: 2, maxItems: 100, items: {type: string}}
        canonical_id: {type: [string, 'null']}
        reason: {type: string, minLength: 1}
        preserve_disagreements: {type: boolean}
    TraceMemoryInput:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target: {$ref: '#/components/schemas/MemoryTarget'}
    MemoryOperationResponse:
      type: object
      required: [contract_version, result]
      properties:
        contract_version: {$ref: '#/components/schemas/MemoryContractVersion'}
        result:
          type: object
          required: [operation, result]
          properties:
            operation: {type: string, enum: [remember, relate, recall, update, update_relationship, forget, consolidate, trace]}
            result:
              description: Typed record, relationship, recall, consolidation, trace, or durability-gated mutation receipt result.

paths:
  /v1/memory/operations:
    post:
      operationId: executeMemoryOperation
      summary: Execute one versioned domain-neutral high-level memory operation
      description: The server injects trusted workspace, actor, agent, session, permissions, request, and correlation context after authentication. Operation payloads cannot override that boundary.
      tags: [Memory]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemoryOperationRequest'}
      responses:
        '200':
          description: Typed operation response; mutation receipts are returned only after the configured durability gate.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemoryOperationResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Independently configured capability denied or policy approval required}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Version or idempotency conflict}
        '422': {description: Invalid explicit recall budget}
        '503': {description: Durability gate, semantic provider, or overload unavailable}
  /v1/admin/storage/snapshots:
    post:
      operationId: createDatabaseSnapshot
      summary: Create a coherent snapshot under the canonical write barrier
      tags: [Database Operations]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSnapshotCommand'}
      responses:
        '200':
          description: Snapshot validated and ready for local or S3/MinIO export
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean, const: true}
                  result: {$ref: '#/components/schemas/SnapshotReport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/admin/storage/indexes/rebuild:
    post:
      operationId: rebuildDatabaseIndexes
      summary: Rebuild all derived indexes from canonical data
      tags: [Database Operations]
      responses:
        '200': {description: Rebuild resumed or completed with explicit readiness}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/admin/storage/operations:
    get:
      operationId: getDatabaseOperationStatus
      summary: Inspect snapshot and rebuild progress counters
      tags: [Database Operations]
      responses:
        '200':
          description: Bounded database operation status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean, const: true}
                  result: {$ref: '#/components/schemas/DatabaseOperationMetrics'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /health:
    get:
      operationId: getHealth
      summary: Service health, version, uptime, and session expiration metrics
      deprecated: true
      description: Deprecated composite diagnostic. Use `/health/live` for liveness and `/health/ready` for readiness.
      tags: [Operations]
      security: []
      responses:
        '200':
          description: Healthy process
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Deprecation:
              schema: {type: string, const: 'true'}
            Link:
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version, lifecycle_state, uptime_ms, session_ttl_metrics, durability]
                properties:
                  status: {type: string, const: ok}
                  service: {type: string, const: corrobore-http-server}
                  version: {type: string}
                  lifecycle_state:
                    type: string
                    enum: [initializing, ready, draining, stopped, failed]
                  storage_mode:
                    type: string
                    enum: [ephemeral, persistent]
                  uptime_ms: {type: integer}
                  session_ttl_metrics:
                    type: object
                    properties:
                      total_expired_sessions: {type: integer}
                      expired_last_5m_sessions: {type: integer}
                  durability:
                    type: object
                    required:
                      - controls
                      - storage_version
                      - record_format
                      - wal_bytes
                      - wal_lag_sequences
                      - checkpoint_sequence
                      - checkpoint_age_seconds
                      - compaction_backlog_bytes
                      - page_ins
                      - cache_hits
                      - resident_hot_nodes
                      - resident_hot_relationships
                      - resident_warm_adjacency_entries
                      - resident_cold_nodes
                      - resident_cold_relationships
                      - node_index_entries
                      - relationship_index_entries
                      - label_index_entries
                      - relationship_type_index_entries
                      - recovery
                    properties:
                      controls:
                        type: object
                        required: [require_fsync, strict_recovery]
                        properties:
                          require_fsync: {type: boolean}
                          strict_recovery: {type: boolean}
                      storage_version:
                        description: Validated persistent storage version; null in ephemeral mode.
                        oneOf:
                          - {type: string, enum: [V1]}
                          - {type: 'null'}
                      record_format:
                        description: Validated persistent record format; null in ephemeral mode.
                        oneOf:
                          - {type: string, enum: [JsonLinesV1]}
                          - {type: 'null'}
                      wal_bytes: {type: integer, minimum: 0}
                      wal_lag_sequences: {type: integer, minimum: 0}
                      checkpoint_sequence:
                        oneOf:
                          - {type: integer, minimum: 0}
                          - {type: 'null'}
                      checkpoint_age_seconds:
                        oneOf:
                          - {type: integer, minimum: 0}
                          - {type: 'null'}
                      compaction_backlog_bytes: {type: integer, minimum: 0}
                      page_ins: {type: integer, minimum: 0}
                      cache_hits: {type: integer, minimum: 0}
                      resident_hot_nodes: {type: integer, minimum: 0}
                      resident_hot_relationships: {type: integer, minimum: 0}
                      resident_warm_adjacency_entries: {type: integer, minimum: 0}
                      resident_cold_nodes: {type: integer, minimum: 0}
                      resident_cold_relationships: {type: integer, minimum: 0}
                      node_index_entries: {type: integer, minimum: 0}
                      relationship_index_entries: {type: integer, minimum: 0}
                      label_index_entries: {type: integer, minimum: 0}
                      relationship_type_index_entries: {type: integer, minimum: 0}
                      recovery:
                        type: object
                        required: [outcome, manifest_validated, required_components_validated, catalog_recovered, adjacency_storage_recovered, warning_count, derived_state_rebuilt, replayed_transaction_count, recovery_path]
                        properties:
                          replayed_transaction_count: {type: integer, minimum: 0}
                          recovery_path:
                            oneOf:
                              - {type: string, enum: [checkpoint_and_bounded_replay, full_replay]}
                              - {type: 'null'}
                          outcome:
                            type: string
                            enum: [ephemeral, recovered, unavailable]
                          manifest_validated: {type: boolean}
                          required_components_validated: {type: boolean}
                          catalog_recovered: {type: boolean}
                          adjacency_storage_recovered: {type: boolean}
                          warning_count: {type: integer, minimum: 0}
                          derived_state_rebuilt: {type: boolean}

  /health/live:
    get:
      operationId: getLiveness
      summary: Process liveness without a readiness claim
      tags: [Operations]
      security: []
      responses:
        '200':
          description: HTTP event loop is serving responses
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema:
                type: object
                required: [status, live, service, lifecycle_state]
                properties:
                  status: {type: string, const: live}
                  live: {type: boolean, const: true}
                  service: {type: string, const: corrobore-http-server}
                  lifecycle_state:
                    type: string
                    enum: [initializing, ready, draining, stopped, failed]

  /health/ready:
    get:
      operationId: getReadiness
      summary: Runtime, storage-recovery, and lifecycle readiness
      tags: [Operations]
      security: []
      responses:
        '200':
          description: Runtime is initialized, storage is recovered, and requests are accepted
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadinessResponse'}
        '503':
          description: Runtime is initializing, draining, stopped, or failed
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadinessResponse'}

  /version:
    get:
      operationId: getVersion
      summary: Reproducible build and storage-format compatibility metadata
      tags: [Operations]
      security: []
      responses:
        '200':
          description: Non-secret build and compatibility metadata
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema:
                type: object
                required: [service, version, commit, build_target, storage_compatibility]
                properties:
                  service: {type: string, const: corrobore-http-server}
                  version: {type: string}
                  commit: {type: string}
                  build_target: {type: string}
                  storage_compatibility:
                    type: object
                    required: [supported_versions, supported_record_formats, active_storage_version, active_record_format]
                    properties:
                      supported_versions:
                        type: array
                        items: {type: string, enum: [V1]}
                      supported_record_formats:
                        type: array
                        items: {type: string, enum: [JsonLinesV1]}
                      active_storage_version: {type: [string, 'null']}
                      active_record_format: {type: [string, 'null']}

  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus text metrics
      tags: [Operations]
      security: []
      responses:
        '200':
          description: Prometheus exposition
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            text/plain:
              schema: {type: string}

  /v1/cypher/read:
    post:
      operationId: executeCypherRead
      summary: Execute a forced read-only Cypher request
      tags: [Cypher]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CypherRequest'}
      responses:
        '200':
          description: Runtime response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CypherEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/cypher/write:
    post:
      operationId: executeCypherWrite
      summary: Execute a forced mutation Cypher request
      tags: [Cypher]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CypherRequest'}
      responses:
        '200':
          description: Runtime response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CypherEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/cypher/execute:
    post:
      operationId: executeCypher
      summary: Execute Cypher with explicit or automatic mode
      tags: [Cypher]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CypherRequest'}
      responses:
        '200':
          description: Runtime response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CypherEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/seed/search:
    post:
      operationId: searchSeeds
      summary: Rank graph seed nodes for a natural-language objective
      tags: [Seeds]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objective]
              properties:
                objective: {type: string}
                workspace_id: {type: string}
                domain_profile:
                  type: string
                  enum: [cti, fimi, crisis, cross_domain]
                mode:
                  type: string
                  enum: [hybrid, full_text, semantic, vector]
                top_k: {type: integer, minimum: 1, default: 10}
                score_threshold: {type: number, default: 0.0}
      responses:
        '200':
          description: Ranked candidates
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean, const: true}
                  result:
                    type: object
                    properties:
                      candidates:
                        type: array
                        items:
                          type: object
                          properties:
                            node_id: {type: string}
                            score: {type: number}
                            explanation:
                              type: object
                              properties:
                                rationale: {type: string}
                                source_refs: {type: array, items: {type: string}}
                                boundary_notes: {type: array, items: {type: string}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422':
          description: No seed, ambiguous seed, or overbroad objective
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/domains/{domain}/validate:
    post:
      operationId: validateDomainNode
      summary: Validate domain data through a native domain provider
      tags: [Domains]
      parameters:
        - name: domain
          in: path
          required: true
          schema: {type: string, enum: [cti, fimi, crisis, medical, research]}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                request_id: {type: string}
                workspace_id: {type: string}
                snapshot_id: {type: string}
                payload: {}
      responses:
        '200':
          description: Correlated provider validation response
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: {type: boolean, const: true}
                  result:
                    type: object
                    required: [schema_version, request_id, status, issues]
                    properties:
                      schema_version: {type: string, const: '1'}
                      request_id: {type: string}
                      status: {type: string, enum: [accepted, rejected, failed]}
                      issues:
                        type: array
                        items: {$ref: '#/components/schemas/DomainProviderIssue'}
                      diagnostics: {type: [object, 'null'], additionalProperties: true}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/BadRequest'}
        '502': {$ref: '#/components/responses/BadRequest'}
        '503': {$ref: '#/components/responses/BadRequest'}
        '504': {$ref: '#/components/responses/BadRequest'}

  /v1/license/status:
    get:
      operationId: getLicenseStatus
      summary: Read runtime enterprise license status
      tags: [Operations]
      responses:
        '200':
          description: Active runtime license summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean, const: true}
                  result:
                    type: object
                    properties:
                      source: {type: string, enum: [signed_pem, legacy_env, none]}
                      client_uuid: {type: [string, 'null']}
                      client_email: {type: [string, 'null']}
                      modules:
                        type: array
                        items: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/admin/license/status:
    get:
      operationId: getAdminLicenseStatus
      summary: Read runtime enterprise license status with admin token boundary
      tags: [Operations]
      security: []
      responses:
        '200':
          description: Active runtime license summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean, const: true}
                  result:
                    type: object
                    properties:
                      source: {type: string, enum: [signed_pem, legacy_env, none]}
                      client_uuid: {type: [string, 'null']}
                      client_email: {type: [string, 'null']}
                      modules:
                        type: array
                        items: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/BadRequest'}

  /v1/admin/domain-providers/status:
    get:
      operationId: getAdminDomainProviderStatus
      summary: Read non-sensitive native provider readiness with admin token boundary
      tags: [Operations]
      security: []
      responses:
        '200':
          description: Loaded provider identity, capabilities, and readiness
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: {type: boolean, const: true}
                  result:
                    type: object
                    required: [providers]
                    properties:
                      providers:
                        type: array
                        items:
                          type: object
                          required: [provider_id, provider_version, domain, capabilities, ready]
                          properties:
                            provider_id: {type: string}
                            provider_version: {type: string}
                            domain: {type: string, enum: [cti, fimi, crisis, medical, research]}
                            capabilities:
                              type: array
                              items: {$ref: '#/components/schemas/DomainProviderCapability'}
                            ready: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/BadRequest'}

  /v1/import/stix:
    post:
      operationId: importStixBundle
      summary: Import a STIX 2.1 bundle
      tags: [STIX]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StixImportRequest'
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean, const: true}
                  result: {$ref: '#/components/schemas/ImportResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/import/stix/file:
    post:
      operationId: importStixFile
      summary: Import a multipart .json or .stix file
      tags: [STIX]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                workspace_id: {type: string}
                session_id: {type: string}
                budget_ref: {type: string}
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean, const: true}
                  result: {$ref: '#/components/schemas/ImportResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/opencti/sync/batches:
    post:
      operationId: applyOpenCtiSyncBatch
      summary: Apply one bounded, ordered OpenCTI snapshot or mutation batch
      tags: [Import]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batch]
              properties:
                batch:
                  $ref: '#/components/schemas/OpenCtiSyncBatch'
                expected:
                  oneOf:
                    - {$ref: '#/components/schemas/OpenCtiGraphDigest'}
                    - {type: 'null'}
                  description: Optional multi-dimensional parity digest.
      responses:
        '200':
          description: Canonical WAL commit and durable source checkpoint
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: {type: boolean, const: true}
                  result: {type: object}
        '400':
          description: Invalid order, phase, replay identity, or bulk boundary
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422':
          description: Persistent WAL storage is required
        '503':
          description: Canonical commit or checkpoint persistence failed

  /v1/opencti/sync/status:
    get:
      operationId: getOpenCtiSyncStatus
      summary: Read OpenCTI synchronization lag, checkpoint, and divergence
      tags: [Import]
      responses:
        '200':
          description: Current non-secret synchronization observability
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: {type: boolean, const: true}
                  result: {$ref: '#/components/schemas/OpenCtiSyncStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/opencti/writes:
    post:
      operationId: executeOpenCtiTransactionalWrite
      summary: Commit a Corrobore-authoritative write and enqueue verified reference projection
      tags: [Import]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpenCtiWriteRequest'}
      responses:
        '200':
          description: Canonical Corrobore Knowledge Data Engine response envelope
          content:
            application/json:
              schema: {type: object}
        '400':
          description: Invalid operation, optimistic conflict, or missing idempotency key
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413':
          description: Configured payload-byte limit exceeded
        '503':
          description: Write suspension, outbox backpressure, or durable state failure
        '504':
          description: Configured write deadline exceeded

  /v1/opencti/files:
    post:
      operationId: executeOpenCtiFileCommand
      summary: Enqueue file-content extraction or delete file-content projections
      tags: [Import]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: Enqueue
                  required: [operation, descriptor]
                  properties:
                    operation: {type: string, const: enqueue}
                    descriptor:
                      type: object
                      description: >-
                        Canonical file identity, provenance, digest, and access
                        metadata for one immutable object-storage version.
                - type: object
                  title: Delete
                  required: [operation, file_ids]
                  properties:
                    operation: {type: string, const: delete}
                    file_ids:
                      type: array
                      minItems: 1
                      items: {type: string}
                      description: Stable OpenCTI file identifiers.
      responses:
        '200':
          description: File-content projections deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: {type: boolean, const: true}
                  result: {type: string, enum: [deleted]}
        '202':
          description: Extraction accepted, or recognized as an already-queued duplicate
          content:
            application/json:
              schema:
                type: object
                required: [ok, result, job_id]
                properties:
                  ok: {type: boolean, const: true}
                  result: {type: string, enum: [enqueued, duplicate]}
                  job_id:
                    type: string
                    description: Deterministic queue identity for the enqueued extraction.
        '400':
          description: Invalid descriptor, or a blank or empty `file_ids` list
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503':
          description: Persistent canonical storage is required but not configured

  /v1/opencti/writes/status:
    get:
      operationId: getOpenCtiTransactionalWriteStatus
      summary: Inspect primary-write authority, projection lag, audit, and recovery state
      tags: [Import]
      responses:
        '200':
          description: Bounded counters, projections, reconciliations, and committed WAL receipts
          content:
            application/json:
              schema:
                type: object
                required: [ok, result, reconciliations, projections, audits]
                properties:
                  ok: {type: boolean, const: true}
                  result: {$ref: '#/components/schemas/OpenCtiWriteStatus'}
                  reconciliations: {type: array, items: {type: object}}
                  projections: {type: array, items: {type: object}}
                  audits: {type: array, items: {type: object}}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/admin/opencti/projection/drain:
    post:
      operationId: drainOpenCtiReferenceProjection
      summary: Retry the ordered reference projection outbox
      tags: [Import]
      responses:
        '200': {description: Current projection status after bounded drain}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {description: Durable projection state failure}

  /v1/admin/opencti/reconstruction:
    post:
      operationId: reconstructOpenCtiReference
      summary: Export a lossless canonical corpus for a clean reference rebuild
      tags: [Import]
      responses:
        '200': {description: Deterministic records and canonical outbox high-water sequence}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {description: Persistent canonical storage unavailable}

  /v1/admin/opencti/authority/suspend:
    post:
      operationId: suspendOpenCtiWrites
      summary: Suspend writes for a declared rollback trigger
      tags: [Import]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trigger]
              properties:
                trigger:
                  type: string
                  enum: [security_divergence, corruption, latency_regression, migration_failure, write_divergence, reference_availability]
      responses:
        '200': {description: Writes durably suspended}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/admin/opencti/authority:
    post:
      operationId: transitionOpenCtiWriteAuthority
      summary: Assign exclusive write authority after health, replay, and parity gates
      tags: [Import]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target, reference_healthy, replay_complete, parity_verified]
              properties:
                target:
                  type: string
                  enum: [corrobore_primary, writes_suspended, reference_primary]
                reference_healthy: {type: boolean}
                replay_complete: {type: boolean}
                parity_verified: {type: boolean}
      responses:
        '200': {description: Durable authority after the gated transition}
        '400': {description: One or more transition gates failed}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/opencti/reconciliation:
    post:
      operationId: executeOpenCtiReconciliation
      summary: Dry-run or apply one bounded targeted reconciliation command
      tags: [Import]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpenCtiReconciliationCommand'}
      responses:
        '200':
          description: Exact payload-free difference and repair report
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: {type: boolean, const: true}
                  result: {$ref: '#/components/schemas/OpenCtiReconciliationReport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422':
          description: Invalid, conflicting, unsafe, or over-limit reconciliation command
        '503':
          description: Persistent canonical storage is unavailable

  /v1/opencti/reconciliation/status:
    get:
      operationId: getOpenCtiReconciliationStatus
      summary: Inspect bounded repair, parity, and quarantine evidence
      tags: [Import]
      responses:
        '200':
          description: Oldest-first payload-free retained reconciliation reports
          content:
            application/json:
              schema:
                type: object
                required: [ok, result, reports]
                properties:
                  ok: {type: boolean, const: true}
                  result: {$ref: '#/components/schemas/OpenCtiReconciliationStatus'}
                  reports:
                    type: array
                    items: {$ref: '#/components/schemas/OpenCtiReconciliationReport'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/opencti/shadow/reads:
    post:
      operationId: executeOpenCtiShadowRead
      summary: Return the reference read while comparing Corrobore asynchronously
      tags: [Import]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request, metadata]
              properties:
                request:
                  type: object
                  description: Versioned Knowledge Data Engine read request.
                metadata:
                  type: object
                  required: [environment]
                  properties:
                    environment: {type: string}
                    entity_type: {type: [string, 'null']}
                    user_cohort: {type: [string, 'null']}
      responses:
        '200':
          description: Unmodified reference Knowledge Data Engine response envelope
          content:
            application/json:
              schema: {type: object}
        '400':
          description: Mutation or unsupported operation supplied
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422':
          description: Persistent report storage is required
        '503':
          description: Reference provider is unconfigured or unavailable

  /v1/opencti/shadow/reports:
    get:
      operationId: listOpenCtiShadowReports
      summary: Query privacy-safe durable shadow parity reports
      tags: [Import]
      parameters:
        - {name: query_class, in: query, required: false, schema: {type: string}}
        - {name: release, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 0, maximum: 500}}
      responses:
        '200':
          description: Newest-first redacted parity reports
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: {type: boolean, const: true}
                  result:
                    type: array
                    items: {type: object}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/opencti/reads:
    post:
      operationId: executeOpenCtiRoutedRead
      summary: Execute one read through progressive provider routing
      tags: [Import]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request, metadata]
              properties:
                request: {type: object}
                metadata:
                  type: object
                  required: [environment]
                  properties:
                    environment: {type: string}
                    entity_type: {type: [string, 'null']}
                    user_cohort: {type: [string, 'null']}
                    feature_flags: {type: array, items: {type: string}}
                    session_id: {type: [string, 'null']}
                    index_generation: {type: [string, 'null']}
      responses:
        '200':
          description: Response from exactly the policy-selected primary provider
          content:
            application/json:
              schema: {type: object}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503':
          description: Routing gate blocked or the selected provider failed

  /v1/opencti/routing/decisions:
    get:
      operationId: listOpenCtiRoutingDecisions
      summary: Explain privacy-safe provider decisions and rollback state
      tags: [Import]
      parameters:
        - {name: correlation_id, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 0, maximum: 500}}
      responses:
        '200':
          description: Newest-first bounded provider-decision evidence
          content:
            application/json:
              schema: {type: object}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/opencti/routing/rollback:
    post:
      operationId: rollbackOpenCtiReadRouting
      summary: Open the durable provider-routing circuit breaker
      tags: [Import]
      responses:
        '200':
          description: Rollback persisted and active
          content:
            application/json:
              schema: {type: object}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500':
          description: Durable rollback state could not be persisted

  /v1/stix/validate:
    post:
      operationId: validateStix
      summary: Validate an explicit STIX bundle or current graph nodes
      tags: [STIX]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source: {type: string, enum: [bundle, graph], default: bundle}
                bundle: {$ref: '#/components/schemas/StixBundle'}
                workspace_id: {type: string}
                session_id: {type: string}
                budget_ref: {type: string}
                snapshot_id: {type: string}
      responses:
        '200':
          description: Validation report and optional correction persistence
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean, const: true}
                  result:
                    type: object
                    properties:
                      source_mode: {type: string, enum: [bundle, graph]}
                      valid: {type: boolean}
                      issues: {type: array, items: {type: object}}
                      playbooks_applied: {type: array, items: {type: object}}
                      corrections_summary: {type: [object, 'null']}
                      persistence:
                        anyOf:
                          - {$ref: '#/components/schemas/ImportResult'}
                          - {type: 'null'}
                      errors: {type: array, items: {type: string}}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/export/stix:
    get:
      operationId: exportStix
      summary: Export the current graph as deterministic STIX
      tags: [STIX]
      parameters:
        - {name: snapshot_id, in: query, schema: {type: string, default: snapshot--current}}
        - {name: transaction_id, in: query, schema: {type: string, default: transaction--http-export}}
        - {name: exporter_version, in: query, schema: {type: string, default: corrobore-http-server-v0}}
        - {name: mode, in: query, schema: {type: string, enum: [strict, permissive], default: strict}}
        - {name: profile, in: query, schema: {type: string, enum: [stix-mvp], default: stix-mvp}}
        - name: force
          in: query
          description: Preserve overridable semantic CTI validation findings as diagnostics and include otherwise eligible records; structural and provider/license gates remain enforced.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: CTI-scoped raw STIX bundle with preserved canonical identities, evidence links, and bounded forced-validation diagnostics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StixBundle'}
        '400':
          description: Strict export rejected named non-overridden CTI readiness, identity, evidence-integrity, or endpoint findings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: Enterprise CTI support or the licensed cti module is unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '503':
          description: CTI provider is not ready or lacks node.validate/v1
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/sessions/start:
    post:
      operationId: startSession
      summary: Start a durable session
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id, actor_id]
              properties:
                workspace_id: {type: string}
                actor_id: {type: string}
                actor_kind:
                  type: string
                  enum: [user, agent, orchestrator_agent, worker_agent, tool, system, test_fixture]
                  default: agent
                metadata:
                  type: object
                  additionalProperties: {type: string}
      responses:
        '200':
          description: Started session
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean, const: true}
                  result:
                    type: object
                    properties:
                      session_id: {type: string, format: uuid}
                      status: {$ref: '#/components/schemas/SessionStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/explorer/sessions:
    get:
      operationId: listExplorerSessions
      summary: List current sessions for the graph explorer
      tags: [Explorer]
      parameters:
        - name: include_stopped
          in: query
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Deterministically ordered session read models
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: {type: boolean, const: true}
                  result:
                    type: object
                    required: [sessions]
                    properties:
                      sessions:
                        type: array
                        items: {$ref: '#/components/schemas/ExplorerSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/explorer/sessions/{session_id}/timeline:
    get:
      operationId: getExplorerTimeline
      summary: Read one session's snapshot and timeshot tree
      tags: [Explorer]
      parameters:
        - {$ref: '#/components/parameters/SessionPath'}
      responses:
        '200':
          description: Persisted acyclic temporal lineage
          content:
            application/json:
              schema: {type: object}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/explorer/sessions/{session_id}/graph:
    get:
      operationId: getExplorerGraph
      summary: Project a bounded graph at a selected temporal boundary
      tags: [Explorer]
      parameters:
        - {$ref: '#/components/parameters/SessionPath'}
        - {name: boundary_kind, in: query, schema: {type: string, enum: [current, snapshot, timeshot], default: current}}
        - {name: boundary_id, in: query, schema: {type: string}}
        - {name: max_nodes, in: query, schema: {type: integer, minimum: 1, maximum: 50000, default: 5000}}
        - {name: max_relationships, in: query, schema: {type: integer, minimum: 1, maximum: 100000, default: 10000}}
        - {name: max_properties_per_record, in: query, schema: {type: integer, minimum: 1, maximum: 256, default: 32}}
        - {name: max_payload_bytes, in: query, schema: {type: integer, minimum: 1024, maximum: 16777216, default: 2097152}}
        - {name: max_computation_units, in: query, schema: {type: integer, minimum: 1, maximum: 1000000, default: 100000}}
      responses:
        '200':
          description: Bounded deterministic graph projection with exact boundary identity
          content:
            application/json:
              schema: {type: object}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/sessions/{session_id}/health:
    get:
      operationId: getSessionHealth
      summary: Inspect durable session state
      tags: [Sessions]
      parameters:
        - {$ref: '#/components/parameters/SessionPath'}
      responses:
        '200':
          description: Session health and identity
          content:
            application/json:
              schema: {type: object}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/sessions/{session_id}/logs:
    get:
      operationId: getSessionLogs
      summary: Read filtered session logs and audit parity
      tags: [Sessions]
      parameters:
        - {$ref: '#/components/parameters/SessionPath'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 5000, default: 500}}
        - {name: from_ms, in: query, schema: {type: integer}}
        - {name: to_ms, in: query, schema: {type: integer}}
        - {name: format, in: query, schema: {type: string, enum: [json, ndjson], default: json}}
      responses:
        '200':
          description: JSON envelope or NDJSON log lines
          content:
            application/json:
              schema: {type: object}
            application/x-ndjson:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/sessions/{session_id}/stop:
    post:
      operationId: stopSession
      summary: Stop and persist a session
      tags: [Sessions]
      parameters:
        - {$ref: '#/components/parameters/SessionPath'}
      responses:
        '200':
          description: Stopped session
          content:
            application/json:
              schema: {type: object}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

tags:
  - {name: Operations, description: Public health and observability}
  - {name: Memory, description: Versioned domain-neutral high-level memory operations}
  - {name: Database Operations, description: Administrative snapshot and derived-index operations}
  - {name: Cypher, description: Graph reads and mutations}
  - {name: Seeds, description: Semantic working-set entry points}
  - {name: STIX, description: "Import, validation, and export"}
  - {name: Sessions, description: Durable session lifecycle and audit}
  - {name: Explorer, description: Read-only temporal graph exploration}
